services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    container_name: masters-glossary-frontend
    restart: unless-stopped
    volumes:
      # Mount Let's Encrypt certificates
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Mount certbot webroot for ACME challenge renewal
      - certbot-www:/var/www/certbot
    networks:
      - app-network

volumes:
  certbot-www:

networks:
  app-network:
    driver: bridge


